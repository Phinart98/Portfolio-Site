<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="flowTitle flowDesc" role="img" viewBox="0 0 760 750"><title id="flowTitle">How a patient connects their records</title><desc id="flowDesc">Sequence diagram with three columns: the patient, the backend Philip built at D4CG, and the hospital&apos;s records system. Six numbered steps show the login flow from clicking connect to records appearing, with the access token stored encrypted along the way.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#C2410C" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,sans-serif}.head,.title{font-weight:600;fill:#1f2937}.title{font-size:19px}.head{font-size:15.5px}.headsub{font-size:12px;fill:#57534e}.headw{font-size:15.5px;font-weight:600;fill:#fff}.headsubw{font-size:12px;fill:#fdebdd}.lbl{font-size:15px;fill:#1f2937}.num,.pill,.sub{font-size:13px}.sub{fill:#57534e}.num{font-weight:700;fill:#fff}.pill{font-weight:600;fill:#9a3412}.cap{font-size:13.5px;font-style:italic;fill:#78716c}</style><rect width="756" height="746" x="2" y="2" fill="#FDF8F1" stroke="#EAD9C0" stroke-width="1.5" rx="14"/><text x="380" y="46" class="title" text-anchor="middle">How a patient connects their records</text><line x1="110" x2="110" y1="132" y2="675" stroke="#D8C9B6" stroke-dasharray="4 6" stroke-width="2"/><line x1="380" x2="380" y1="132" y2="675" stroke="#D8C9B6" stroke-dasharray="4 6" stroke-width="2"/><line x1="650" x2="650" y1="132" y2="675" stroke="#D8C9B6" stroke-dasharray="4 6" stroke-width="2"/><rect width="200" height="58" x="10" y="72" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="110" y="107" class="head" text-anchor="middle">The patient</text><rect width="200" height="58" x="280" y="72" fill="#9A3412" rx="10"/><text x="380" y="97" class="headw" text-anchor="middle">The backend I built</text><text x="380" y="117" class="headsubw" text-anchor="middle">running at D4CG</text><rect width="200" height="58" x="550" y="72" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="650" y="97" class="head" text-anchor="middle">The hospital’s system</text><text x="650" y="117" class="headsub" text-anchor="middle">Epic, Oracle Health, and others</text><text x="245" y="180" class="lbl" text-anchor="middle">The patient clicks “Connect my records”</text><line x1="124" x2="362" y1="202" y2="202" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="140" cy="202" r="13" fill="#9A3412"/><text x="140" y="206.5" class="num" text-anchor="middle">1</text><text x="515" y="248" class="lbl" text-anchor="middle">It reads the hospital’s self-description</text><text x="515" y="268" class="sub" text-anchor="middle">(the discovery document)</text><line x1="394" x2="632" y1="288" y2="288" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="410" cy="288" r="13" fill="#9A3412"/><text x="410" y="292.5" class="num" text-anchor="middle">2</text><text x="380" y="334" class="lbl" text-anchor="middle">They log in on the hospital’s own page and approve access</text><text x="380" y="354" class="sub" text-anchor="middle">their password never touches the app</text><line x1="124" x2="632" y1="374" y2="374" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="140" cy="374" r="13" fill="#9A3412"/><text x="140" y="378.5" class="num" text-anchor="middle">3</text><text x="515" y="420" class="lbl" text-anchor="middle">A one-time code comes back</text><line x1="636" x2="398" y1="442" y2="442" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="620" cy="442" r="13" fill="#9A3412"/><text x="620" y="446.5" class="num" text-anchor="middle">4</text><text x="515" y="488" class="lbl" text-anchor="middle">The code, plus a secret proof (PKCE),</text><text x="515" y="508" class="lbl" text-anchor="middle">is traded for an access token</text><line x1="394" x2="632" y1="528" y2="528" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="410" cy="528" r="13" fill="#9A3412"/><text x="410" y="532.5" class="num" text-anchor="middle">5</text><rect width="196" height="32" x="282" y="556" fill="#FDEBDD" stroke="#E5B99B" stroke-width="1.5" rx="16"/><path fill="none" stroke="#9A3412" stroke-width="2" d="M 302 570 v -3.5 a 5 5 0 0 1 10 0 v 3.5"/><rect width="16" height="11" x="299" y="570" fill="#9A3412" rx="2.5"/><text x="324" y="577" class="pill">token stored encrypted</text><text x="245" y="632" class="lbl" text-anchor="middle">Their records appear</text><line x1="366" x2="128" y1="654" y2="654" stroke="#C2410C" stroke-width="2.25" marker-end="url(#arrow)"/><circle cx="350" cy="654" r="13" fill="#9A3412"/><text x="350" y="658.5" class="num" text-anchor="middle">6</text><text x="380" y="716" class="cap" text-anchor="middle">The same flow, driven by the same code, works for any hospital system that speaks SMART on FHIR.</text></svg>