<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="archTitle archDesc" role="img" viewBox="0 0 760 600"><title id="archTitle">What the backend is made of at the end of the summer</title><desc id="archDesc">Architecture diagram. On the left, a patient&apos;s browser and the national endpoint list both call into the backend. The backend has three layers: an HTTP API, a single provider adapter that reads each server&apos;s discovery document, and a normalization layer that reshapes every answer into one US Core shape. Below it, Postgres holds tokens encrypted at rest, OAuth state with a time limit, and sessions. On the right, the same adapter drives Epic&apos;s sandbox, the public SMART Launcher and Oracle Health&apos;s sandbox, with any further server being a configuration entry rather than new code.</desc><defs><marker id="a2" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#C2410C" d="M 0 1 L 9 5 L 0 9 z"/></marker></defs><style>text{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,sans-serif}.head{fill:#1f2937}.head,.headw,.title{font-weight:600}.title{font-size:19px;fill:#1f2937}.head{font-size:15px}.headw{font-size:15.5px;fill:#fff}.headsubw{font-size:12px;fill:#fdebdd}.layer{font-size:14.5px;font-weight:600;fill:#9a3412}.mono,.sub{fill:#57534e}.sub{font-size:12px}.mono{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.cap,.edge{fill:#78716c}.edge{font-size:12px}.cap{font-size:13px;font-style:italic}</style><rect width="756" height="596" x="2" y="2" fill="#FDF8F1" stroke="#EAD9C0" stroke-width="1.5" rx="14"/><text x="380" y="44" class="title" text-anchor="middle">What the backend is made of</text><rect width="370" height="358" x="175" y="86" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="12"/><path fill="#9A3412" d="M 175 98 a 12 12 0 0 1 12 -12 h 346 a 12 12 0 0 1 12 12 v 32 h -370 z"/><text x="360" y="107" class="headw" text-anchor="middle">The backend I built</text><text x="360" y="124" class="headsubw" text-anchor="middle">FastAPI, one codebase, no per-vendor classes</text><rect width="334" height="66" x="193" y="148" fill="#FDF8F1" stroke="#EAD9C0" stroke-width="1.5" rx="9"/><text x="207" y="170" class="layer">The API a caller talks to</text><text x="207" y="190" class="mono">/auth/connect /auth/callback /providers/search</text><text x="207" y="206" class="mono">/patients/{id}/summary /providers/endpoint-check</text><rect width="334" height="94" x="193" y="230" fill="#FDEBDD" stroke="#E5B99B" stroke-width="1.5" rx="9"/><text x="207" y="252" class="layer">One provider adapter</text><text x="207" y="272" class="sub">At connection time it reads the server’s own</text><text x="207" y="290" class="sub">description of itself and takes its login URL, its</text><text x="207" y="308" class="sub">token URL, PKCE and client authentication from it.</text><rect width="334" height="66" x="193" y="340" fill="#FDF8F1" stroke="#EAD9C0" stroke-width="1.5" rx="9"/><text x="207" y="362" class="layer">Normalization</text><text x="207" y="382" class="sub">Every server’s answer reshaped into one US Core</text><text x="207" y="398" class="sub">shape, with the untouched original alongside it.</text><line x1="360" x2="360" y1="444" y2="466" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><rect width="370" height="62" x="175" y="472" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><path fill="none" stroke="#9A3412" stroke-width="2" d="M 199 494 v -4 a 6 6 0 0 1 12 0 v 4"/><rect width="18" height="13" x="196" y="494" fill="#9A3412" rx="3"/><text x="226" y="497" class="head">Postgres</text><text x="226" y="516" class="sub">Tokens encrypted at rest, OAuth state that expires, sessions</text><rect width="132" height="56" x="20" y="160" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="86" y="184" class="head" text-anchor="middle">The patient’s</text><text x="86" y="202" class="head" text-anchor="middle">browser</text><line x1="154" x2="167" y1="188" y2="188" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><rect width="132" height="72" x="20" y="300" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="86" y="324" class="head" text-anchor="middle">The national</text><text x="86" y="342" class="head" text-anchor="middle">endpoint list</text><text x="86" y="360" class="sub" text-anchor="middle">~70,000 entries</text><line x1="154" x2="167" y1="336" y2="336" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><line x1="545" x2="566" y1="277" y2="277" stroke="#C2410C" stroke-width="2.25"/><line x1="566" x2="566" y1="150" y2="440" stroke="#C2410C" stroke-width="2.25"/><rect width="154" height="58" x="586" y="122" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="663" y="145" class="head" text-anchor="middle">Epic sandbox</text><text x="663" y="164" class="sub" text-anchor="middle">holds a secret</text><line x1="566" x2="578" y1="150" y2="150" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><rect width="154" height="58" x="586" y="200" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="663" y="223" class="head" text-anchor="middle">SMART Launcher</text><text x="663" y="242" class="sub" text-anchor="middle">no secret, PKCE only</text><line x1="566" x2="578" y1="228" y2="228" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><rect width="154" height="66" x="586" y="278" fill="#FFF" stroke="#DCCDB9" stroke-width="1.5" rx="10"/><text x="663" y="301" class="head" text-anchor="middle">Oracle Health</text><text x="663" y="319" class="head" text-anchor="middle">sandbox</text><text x="663" y="336" class="sub" text-anchor="middle">grants no wildcard scope</text><line x1="566" x2="578" y1="310" y2="310" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><rect width="154" height="74" x="586" y="366" fill="#FDF8F1" stroke="#DCCDB9" stroke-dasharray="5 5" stroke-width="1.5" rx="10"/><text x="663" y="390" class="head" text-anchor="middle">Any other server</text><text x="663" y="409" class="sub" text-anchor="middle">that speaks the</text><text x="663" y="425" class="sub" text-anchor="middle">standard</text><line x1="566" x2="578" y1="403" y2="403" stroke="#C2410C" stroke-width="2.25" marker-end="url(#a2)"/><text x="663" y="464" class="edge" text-anchor="middle">a configuration entry,</text><text x="663" y="480" class="edge" text-anchor="middle">not new code</text><text x="380" y="566" class="cap" text-anchor="middle">The three servers on the right differ about as much as two SMART servers can. The same unchanged code drives all of them.</text></svg>